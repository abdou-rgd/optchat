name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install httpx (the only dependency)
        run: pip install httpx==0.28.1
      # No model server here: the tests use a fake model.
      - name: Tests
        run: python -m unittest discover -s tests
      - name: The tests left the tracked files unchanged
        run: git diff --exit-code
